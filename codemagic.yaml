workflows:
  ios-release:
    name: VoxNote iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: reelcraft
    environment:
      groups:
        - appstore_credentials
      node: latest
      xcode: latest
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
          cd ios/App && pod install --repo-update || true
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.voicenotes.speechtotext.app" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "com.voicenotes.speechtotext.app" 2>/dev/null || echo 19)
          if [ -z "$LATEST_BUILD" ] || [ "$LATEST_BUILD" -lt 19 ]; then
            NEW_BUILD=20
          else
            NEW_BUILD=$((LATEST_BUILD + 1))
          fi
          echo "Setting build number to $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD
      - name: Build iOS Xcode App
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "App"
          else
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

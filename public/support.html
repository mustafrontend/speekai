<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support & Contact — SpeekAI</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .container {
      max-width: 768px;
      margin: 40px auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.025em;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 14px;
      color: #475569;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #0f172a;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      border-radius: 14px;
    }
    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="SpeekAI Logo" class="logo" />
    <h1>SpeekAI Support Center</h1>
    <p>Need help with your 1-tap voice notes, AI speech transcription, or subscription?</p>
    <p>Our dedicated support team is here to assist you 24/7.</p>
    <a href="mailto:support@speekai.app" class="btn">Email Customer Support</a>

    <div class="footer">
      © 2026 SpeekAI Inc. All rights reserved.
    </div>
  </div>
</body>
</html>
